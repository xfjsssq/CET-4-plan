 <style>
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:3rem}
*{box-sizing:border-box}
:root{--bg:#f7f5f0;--surface:#ffffff;--surface2:#efece4;--ink:#1c2420;--muted:#5b665f;--line:#ddd8cb;--accent:#1f6b4a;--accent-ink:#ffffff;--accent-soft:#e3efe7;--amber:#9a6b12;--amber-soft:#f7ecd2;--red:#9c3d2e;--red-soft:#f9e6e1;--blue:#2f5d8a;--blue-soft:#e4ecf5;--radius:14px;--font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
@media (prefers-color-scheme: dark){:root{--bg:#141816;--surface:#1e2421;--surface2:#262d29;--ink:#ece9e0;--muted:#a8b0a8;--line:#3a423c;--accent:#4db380;--accent-ink:#0d1f16;--accent-soft:#223a2d;--amber:#e0b45a;--amber-soft:#3d3319;--red:#e08a76;--red-soft:#3d2620;--blue:#8db4d9;--blue-soft:#25374a}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
a{color:var(--accent);text-underline-offset:3px}
h1{font-family:var(--serif);font-size:1.8rem;line-height:1.3;margin:0}
h2{font-size:1.25rem;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.hero{padding:28px 0 8px}
.meta{background:var(--accent-soft);border-radius:var(--radius);padding:14px 18px;margin-top:14px}
.meta p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
.btn{display:inline-block;margin:6px 8px 0 0;padding:12px 18px;min-height:48px;background:var(--accent);color:var(--accent-ink);border-radius:10px;text-decoration:none;font-weight:700;border:1px solid var(--accent);cursor:pointer;font:inherit}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.bar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--accent);width:0%}
.word{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-top:12px}
.word.en{font-size:1.3rem;font-weight:800}
.word.en.no{color:var(--muted);font-size:.9rem;font-weight:600;margin-right:8px}
.word.pron{color:var(--muted);font-size:.9rem;margin-left:8px}
.word.zh{font-weight:700;margin-top:2px}
.word.ex{margin-top:8px;font-style:italic}
.word.note{margin-top:6px;font-size:.9rem;color:var(--muted)}
.mark{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mark button{flex:1;min-width:90px;min-height:48px;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
.mark button.on-known{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mark button.on-fuzzy{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.mark button.on-unknown{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.mark button[data-state="known"].on-known,.mark button[data-state="fuzzy"].on-fuzzy,.mark button[data-state="unknown"].on-unknown{outline:2px solid currentColor;outline-offset:1px}
.done-tag{display:none;color:var(--accent);font-weight:700;font-size:.9rem}
.word.done.done-tag{display:inline}
textarea{width:100%;min-height:140px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
</style>
</head>
